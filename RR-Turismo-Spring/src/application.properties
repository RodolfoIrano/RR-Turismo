# Porta do servidor. No seu computador e 9000. Na nuvem (Render, Railway...) a propria
# hospedagem manda a porta pela variavel PORT, entao ela tem prioridade.
server.port=${PORT:9000}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Banco de dados. Sem configurar nada, usa o MySQL do seu computador (localhost:3306).
# Na nuvem, defina a variavel DB_URL com o endereco completo do banco (veja docs/NUVEM.md),
# ou so DB_HOST / DB_PORT / DB_NOME se o seu banco nao precisar de SSL.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NOME:turismo_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# false: nao imprime cada consulta SQL no terminal (imprimir deixa o servidor mais lento).
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

spring.web.resources.static-locations=classpath:/main/resources/,classpath:/static,classpath:/main/resources/static

spring.mvc.view.prefix=/view/
spring.mvc.view.suffix=.jsp

# Upload de imagens (fotos de viagem/perfil). O padrao do Spring e 1 MB, o que
# fazia o "Criar viagem" falhar com fotos de celular.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Configuracao PESSOAL (senha do MySQL etc.). Crie o arquivo application-local.properties
# ao lado do rodar.bat - ele NAO vai para o Git (esta no .gitignore).
spring.config.import=optional:file:./application-local.properties

# --- Desempenho ---
# Comprime HTML, CSS, JS e JSON antes de enviar (paginas bem menores e mais rapidas).
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
server.compression.min-response-size=1024
# O navegador guarda CSS, JS e imagens do site por 10 minutos (nao baixa tudo de novo a cada pagina).
spring.web.resources.cache.cachecontrol.max-age=10m

# --- Site num subcaminho (ex.: servidor da Fatec: https://lobato.fatectq.edu.br/pi/rrturismo/) ---
# Deixe VAZIO no seu computador. No servidor, defina a variavel de ambiente BASE_PATH=/pi/rrturismo
# (ou escreva rr.base-path=/pi/rrturismo no application-local.properties). Veja docs/FATEC_SUBCAMINHO.md
rr.base-path=${BASE_PATH:}
# Nome proprio do cookie de login (evita conflito com outros sistemas Java no mesmo servidor).
server.servlet.session.cookie.name=RRTURISMO_SESSAO
