server.port=9000

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/turismo_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_SENHA:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming-strategy=org.hibernate.cfg.ImprovedNamingStrategy
hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

spring.web.resources.static-locations=classpath:/main/resources/,classpath:/static,classpath:/main/resources/static

spring.mvc.view.prefix=/view/
spring.mvc.view.suffix=.jsp

# Upload de imagens (fotos de viagem/perfil). O padrao do Spring e 1 MB, o que
# fazia o "Criar viagem" falhar com fotos de celular.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# Configuracao PESSOAL (senha do MySQL etc.). Crie o arquivo application-local.properties
# ao lado do rodar.bat - ele NAO vai para o Git (esta no .gitignore).
spring.config.import=optional:file:./application-local.properties
